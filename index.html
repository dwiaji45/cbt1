<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservasi Rumah Bekam Monggang</title>
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1RJkvv-OsdOchFl2L-oimzZpHAOzoPAZr">
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 500px; margin: auto; background-color: #f9f9f9;}
        
        /* Styling Form */
        .form-container { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        
        /* Styling Logo */
        .logo-container { text-align: center; margin-bottom: 10px; }
        .logo-container img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid #27ae60; padding: 2px;}
        
        h2 { text-align: center; color: #2c3e50; margin-top: 5px; margin-bottom: 20px;}
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px;}
        input, textarea, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold;}
        button:hover { background-color: #2ecc71; }
        #pesan { margin-top: 15px; text-align: center; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

    <div class="form-container">
        <div class="logo-container">
            <img src="https://lh3.googleusercontent.com/d/1RJkvv-OsdOchFl2L-oimzZpHAOzoPAZr" alt="Logo Rumah Bekam Monggang">
        </div>

        <h2>Form Rumah Bekam Monggang</h2>
        
        <form id="bookingForm">
            <div class="form-group">
                <label>Nama Lengkap</label>
                <input type="text" id="nama" required>
            </div>
            <div class="form-group">
                <label>Nomor WhatsApp (Contoh: 0812...)</label>
                <input type="number" id="no_wa" required>
            </div>
            <div class="form-group">
                <label>Tanggal Bekam</label>
                <input type="date" id="tanggal" required>
            </div>
            <div class="form-group">
                <label>Pilih Jam</label>
                <select id="jam" required>
                    <option value="" disabled selected>-- Pilih Waktu --</option>
                    <option value="09:00">09:00 WIB</option>
                    <option value="13:00">13:00 WIB</option>
                    <option value="16:00">16:00 WIB</option>
                </select>
            </div>
            <div class="form-group">
                <label>Keluhan Utama</label>
                <textarea id="keluhan" rows="3" required placeholder="Misal: Pegal-pegal, tensi tinggi, kolesterol..."></textarea>
            </div>
            <button type="submit" id="btnSubmit">Kirim Reservasi</button>
        </form>

        <div id="pesan"></div>
    </div>

    <script>
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz0UPb8fuwA8PqaqFgpjOjgsyDbCsFO_TGci1pILKwYcndfxRZLIIOyqu4HqnHdSVqe7w/exec';
        
        // Nomor WhatsApp Admin Tujuan (Ubah dengan nomor asli Anda, gunakan awalan 62)
        const NOMOR_WA_ADMIN = "62859148395363"; 

        // Fungsi mengubah tanggal "YYYY-MM-DD" menjadi format "Senin, 25 Mei 2026"
        function formatTanggalIndo(tanggalString) {
            const dateObj = new Date(tanggalString);
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            return dateObj.toLocaleDateString('id-ID', options);
        }

        document.getElementById('bookingForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const btnSubmit = document.getElementById('btnSubmit');
            const pesan = document.getElementById('pesan');
            
            // Ambil data dari input form
            const inputNama = document.getElementById('nama').value;
            const inputNoWA = document.getElementById('no_wa').value;
            const inputTanggal = document.getElementById('tanggal').value;
            const inputJam = document.getElementById('jam').value;
            const inputKeluhan = document.getElementById('keluhan').value;

            btnSubmit.innerText = "Mengirim Data...";
            btnSubmit.disabled = true;

            const data = {
                action: "booking",
                nama: inputNama,
                no_wa: inputNoWA,
                tanggal: inputTanggal,
                jam: inputJam,
                keluhan: inputKeluhan
            };

            fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                if(result.status === "success") {
                    pesan.style.color = "green";
                    pesan.innerText = "✅ Reservasi tersimpan! Mengarahkan ke WhatsApp...";
                    
                    // --- PROSES KIRIM WA OTOMATIS ---
                    const tanggalFormat = formatTanggalIndo(inputTanggal);
                    
                    // Susunan Teks WA
                    const textPesan = `Assalamu'alaikum / Halo Admin Rumah Bekam Monggang, 🙏\n\nSaya telah mengisi form reservasi di website. Berikut adalah detail jadwal saya:\n\n*Nama Lengkap* : ${inputNama}\n*Nomor WhatsApp* : ${inputNoWA}\n*Tanggal Bekam* : ${tanggalFormat}\n*Pilih Jam* : ${inputJam} WIB - Selesai\n*Keluhan Utama* : ${inputKeluhan}\n\nTerima kasih, saya menunggu konfirmasi lebih lanjut dari Admin nggih.`;
                    
                    // Buat Link WA dan buka di Tab Baru
                    const urlWA = `https://wa.me/${NOMOR_WA_ADMIN}?text=${encodeURIComponent(textPesan)}`;
                    window.open(urlWA, '_blank');

                    // Bersihkan form
                    document.getElementById('bookingForm').reset();
                } else {
                    pesan.style.color = "red";
                    pesan.innerText = "❌ Terjadi kesalahan backend. Coba lagi.";
                }
            })
            .catch(error => {
                pesan.style.color = "red";
                pesan.innerText = "❌ Gagal terhubung ke server.";
            })
            .finally(() => {
                btnSubmit.innerText = "Kirim Reservasi";
                btnSubmit.disabled = false;
            });
        });
    </script>
</body>
</html>
