<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservasi Rumah Bekam Monggang</title>
    
    <!-- Import Font Modern dari Google -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1RJkvv-OsdOchFl2L-oimzZpHAOzoPAZr">
    
    <style>
        /* VARIABEL CSS UNTUK DARK & LIGHT MODE */
        :root {
            --bg-body: #f0f4f8;
            --bg-container: #ffffff;
            --text-main: #1e293b;
            --text-muted: #475569;
            --text-label: #475569;
            --border-color: #cbd5e1;
            --input-bg: #f8fafc;
            --session-bg: #f1f5f9;
            --session-border: #e2e8f0;
            --footer-text: #64748b;
            --footer-border: #e2e8f0;
            --footer-title: #334155;
            --shadow: rgba(0, 0, 0, 0.05);
            --logo-border: #e2e8f0;
        }

        [data-theme="dark"] {
            --bg-body: #0f172a;
            --bg-container: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-label: #cbd5e1;
            --border-color: #475569;
            --input-bg: #334155;
            --session-bg: #334155;
            --session-border: #475569;
            --footer-text: #94a3b8;
            --footer-border: #475569;
            --footer-title: #f8fafc;
            --shadow: rgba(0, 0, 0, 0.3);
            --logo-border: #475569;
        }

        /* UKURAN FONT DINAMIS */
        body.font-small { font-size: 12px; }
        body.font-medium { font-size: 14px; }
        body.font-large { font-size: 17px; }

        /* Desain Dasar */
        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: var(--bg-body); 
            margin: 0; 
            padding: 30px 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        /* Desain Container/Card */
        .form-container { 
            background-color: var(--bg-container); 
            padding: 35px 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px var(--shadow); 
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
            margin-bottom: 20px;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }

        /* TOOLBAR AKSESIBILITAS (FONT & TEMA) */
        .accessibility-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .control-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            margin-right: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .acc-btn {
            background-color: var(--input-bg);
            border: 1.5px solid var(--border-color);
            color: var(--text-main);
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            transition: all 0.2s ease;
        }
        .acc-btn:hover {
            background-color: var(--session-bg);
            border-color: var(--text-muted);
        }
        .acc-btn.active {
            background-color: #27ae60;
            border-color: #27ae60;
            color: #ffffff;
        }
        
        /* Area Logo */
        .logo-container { text-align: center; margin-bottom: 15px; }
        .logo-container img { 
            width: 90px; 
            height: 90px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 3px solid var(--logo-border); 
            padding: 3px;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .logo-container img:hover { transform: scale(1.05); }
        
        /* Tipografi Judul */
        h2 { 
            text-align: center; 
            color: var(--text-main); 
            margin-top: 0; 
            margin-bottom: 25px;
            font-size: 1.57em;
            font-weight: 600;
        }
        
        /* Desain Kolom Input */
        .form-group { margin-bottom: 18px; }
        label { 
            display: block; 
            margin-bottom: 8px; 
            font-weight: 500; 
            font-size: 0.93em;
            color: var(--text-label);
        }
        input, textarea { 
            width: 100%; 
            padding: 12px 15px; 
            border: 1.5px solid var(--border-color); 
            border-radius: 10px; 
            box-sizing: border-box; 
            font-family: 'Poppins', sans-serif;
            font-size: 1em;
            color: var(--text-main);
            background-color: var(--input-bg);
            transition: all 0.3s ease;
        }
        
        /* Efek saat input diklik */
        input:focus, textarea:focus {
            outline: none;
            border-color: #27ae60;
            background-color: var(--bg-container);
            box-shadow: 0 0 0 4px rgba(39, 174, 96, 0.1);
        }

        /* TAMPILAN GRID SESI KEKINIAN */
        .session-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 10px;
            margin-top: 5px;
        }
        .session-item {
            position: relative;
        }
        .session-item input[type="radio"] {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }
        .session-label {
            display: block;
            text-align: center;
            background-color: var(--session-bg);
            border: 2px solid var(--session-border);
            border-radius: 10px;
            padding: 12px 8px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-sizing: border-box;
        }
        .session-title {
            font-size: 0.93em;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 2px;
        }
        .session-time {
            font-size: 0.78em;
            color: var(--text-muted);
        }
        /* Efek Hover Pilihan Sesi */
        .session-label:hover {
            border-color: var(--border-color);
        }
        /* Efek Saat Sesi Terpilih (Checked) */
        .session-item input[type="radio"]:checked + .session-label {
            background-color: rgba(39, 174, 96, 0.1);
            border-color: #27ae60;
            box-shadow: 0 0 0 3px rgba(39, 174, 96, 0.15);
        }
        [data-theme="dark"] .session-item input[type="radio"]:checked + .session-label {
            background-color: rgba(39, 174, 96, 0.2);
            border-color: #2ecc71;
        }
        .session-item input[type="radio"]:checked + .session-label .session-title {
            color: #27ae60;
        }
        [data-theme="dark"] .session-item input[type="radio"]:checked + .session-label .session-title {
            color: #2ecc71;
        }

        /* Desain Tombol Utama */
        .btn-submit { 
            width: 100%; 
            padding: 14px; 
            background: linear-gradient(135deg, #27ae60, #229954); 
            color: white; 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-size: 1.07em; 
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            box-shadow: 0 4px 10px rgba(39, 174, 96, 0.3);
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 25px;
        }
        .btn-submit:hover { 
            background: linear-gradient(135deg, #229954, #1e8449); 
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(39, 174, 96, 0.4);
        }
        .btn-submit:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: translateY(0);
            box-shadow: none;
        }

        /* Animasi Loading (Spinner) */
        .spinner {
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            display: none;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Desain Pesan Sukses/Gagal */
        #pesan { 
            margin-top: 15px; 
            text-align: center; 
            font-weight: 500; 
            font-size: 0.93em; 
            padding: 10px;
            border-radius: 8px;
            display: none;
        }
        .pesan-sukses { background-color: #d1fae5; color: #065f46; display: block !important; }
        .pesan-error { background-color: #fee2e2; color: #b91c1c; display: block !important; }

        /* DESAIN FOOTER KLINIK MODERN */
        .clinic-footer {
            width: 100%;
            max-width: 450px;
            text-align: center;
            padding: 15px;
            box-sizing: border-box;
            color: var(--footer-text);
            font-size: 0.85em;
            line-height: 1.6;
            border-top: 1px solid var(--footer-border);
            margin-top: 10px;
            transition: border-color 0.3s ease, color 0.3s ease;
        }
        .clinic-footer .title {
            font-weight: 600;
            color: var(--footer-title);
            font-size: 1.08em;
            margin-bottom: 4px;
        }
        .clinic-footer .address {
            margin-bottom: 6px;
        }
        .clinic-footer .contact {
            font-weight: 500;
            color: #27ae60;
            text-decoration: none;
        }
        .clinic-footer .contact:hover {
            text-decoration: underline;
        }

    </style>
</head>
<body class="font-medium" data-theme="light">

    <div class="form-container">
        
        <!-- TOOLBAR AKSESIBILITAS BARU -->
        <div class="accessibility-bar">
            <div class="control-group">
                <span class="control-label">Ukuran</span>
                <button type="button" class="acc-btn" id="f-small" onclick="setFontSize('small')">A</button>
                <button type="button" class="acc-btn active" id="f-medium" onclick="setFontSize('medium')">B</button>
                <button type="button" class="acc-btn" id="f-large" onclick="setFontSize('large')">C</button>
            </div>
            <div class="control-group">
                <span class="control-label"></span>
                <button type="button" class="acc-btn active" id="t-light" onclick="setTheme('light')">☀️</button>
                <button type="button" class="acc-btn" id="t-dark" onclick="setTheme('dark')">🌙</button>
            </div>
        </div>

        <div class="logo-container">
            <img src="https://lh3.googleusercontent.com/d/1RJkvv-OsdOchFl2L-oimzZpHAOzoPAZr" alt="Logo Rumah Bekam Monggang">
        </div>

        <h2>Form Reservasi Bekam</h2>
        
        <form id="bookingForm">
            <div class="form-group">
                <label>Nama Lengkap</label>
                <input type="text" id="nama" placeholder="Masukkan nama Anda" required>
            </div>
            
            <div class="form-group">
                <label>Nomor WhatsApp</label>
                <input type="number" id="no_wa" placeholder="Contoh: 08123456789" required>
            </div>
            
            <div class="form-group">
                <label>Tanggal Bekam</label>
                <input type="date" id="tanggal" required>
            </div>
            
            <!-- SELEKSI WAKTU MODEL GRID KEKINIAN -->
            <div class="form-group">
                <label>Pilih Sesi Kedatangan</label>
                <div class="session-grid">
                    
                    <div class="session-item">
                        <input type="radio" id="sesiPagi" name="sesi_waktu" value="Sesi Pagi (09:00 - 11:30)" required>
                        <label for="sesiPagi" class="session-label">
                            <div class="session-title">Sesi Pagi</div>
                            <div class="session-time"></div>
                        </label>
                    </div>
                    
                    <div class="session-item">
                        <input type="radio" id="sesiSiang" name="sesi_waktu" value="Sesi Siang (13:00 - 15:00)">
                        <label for="sesiSiang" class="session-label">
                            <div class="session-title">Sesi Siang</div>
                            <div class="session-time"></div>
                        </label>
                    </div>
                    
                    <div class="session-item">
                        <input type="radio" id="sesiSore" name="sesi_waktu" value="Sesi Sore (15:30 - 17:30)">
                        <label for="sesiSore" class="session-label">
                            <div class="session-title">Sesi Sore</div>
                            <div class="session-time"></div>
                        </label>
                    </div>
                    
                </div>
            </div>
            
            <div class="form-group">
                <label>Keluhan Utama</label>
                <textarea id="keluhan" rows="3" required placeholder="Misal: Pegal-pegal, tensi tinggi, kolesterol..."></textarea>
            </div>
            
            <button type="submit" id="btnSubmit" class="btn-submit">
                <div class="spinner" id="loadingSpinner"></div>
                <span id="btnText">Kirim Reservasi</span>
            </button>
        </form>

        <div id="pesan"></div>
    </div>

    <!-- FOOTER INFORMASI KLINIK -->
    <div class="clinic-footer">
        <div class="title">Rumah Bekam Monggang</div>
        <div class="address">Monggang, RT 37, Pendowoharjo, Kec. Sewon, Kabupaten Bantul, Daerah Istimewa Yogyakarta</div>
        <div>Kontak Admin: <a href="https://wa.me/62859148395363" class="contact" target="_blank">+62 859-1483-95363</a></div>
    </div>

    <script>
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz0UPb8fuwA8PqaqFgpjOjgsyDbCsFO_TGci1pILKwYcndfxRZLIIOyqu4HqnHdSVqe7w/exec';
        const NOMOR_WA_ADMIN = "62859148395363"; 

        // --- FUNGSI AKSESIBILITAS (FONT SIZE & TEMA) ---
        function setFontSize(size) {
            document.body.classList.remove('font-small', 'font-medium', 'font-large');
            document.body.classList.add('font-' + size);
            
            document.getElementById('f-small').classList.remove('active');
            document.getElementById('f-medium').classList.remove('active');
            document.getElementById('f-large').classList.remove('active');
            document.getElementById('f-' + size).classList.add('active');
        }

        function setTheme(theme) {
            document.body.setAttribute('data-theme', theme);
            
            document.getElementById('t-light').classList.remove('active');
            document.getElementById('t-dark').classList.remove('active');
            document.getElementById('t-' + theme).classList.add('active');
        }

        function formatTanggalIndo(tanggalString) {
            const dateObj = new Date(tanggalString);
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            return dateObj.toLocaleDateString('id-ID', options);
        }

        document.getElementById('bookingForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const btnSubmit = document.getElementById('btnSubmit');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('loadingSpinner');
            const pesan = document.getElementById('pesan');
            
            const inputNama = document.getElementById('nama').value;
            const inputNoWA = document.getElementById('no_wa').value;
            const inputTanggal = document.getElementById('tanggal').value;
            const inputKeluhan = document.getElementById('keluhan').value;
            
            const selectedSessionElement = document.querySelector('input[name="sesi_waktu"]:checked');
            const inputJam = selectedSessionElement ? selectedSessionElement.value : '-';

            // --- TAMPILKAN ANIMASI LOADING ---
            btnText.innerText = "Memproses Data...";
            spinner.style.display = "block";
            btnSubmit.disabled = true;
            
            pesan.className = "";
            pesan.innerText = "";

            const data = {
                action: "booking",
                nama: inputNama,
                no_wa: inputNoWA,
                tanggal: inputTanggal,
                jam: inputJam,
                keluhan: inputKeluhan
            };

            fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                if(result.status === "success") {
                    pesan.className = "pesan-sukses";
                    pesan.innerText = "✅ Berhasil! Mengarahkan ke WhatsApp...";
                    
                    const tanggalFormat = formatTanggalIndo(inputTanggal);
                    const textPesan = `Assalamu'alaikum Rumah Bekam Monggang, 🙏

Saya telah mengisi form reservasi di website. Berikut detail jadwal saya:

*Nama* : ${inputNama}
*No. WA* : ${inputNoWA}
*Tanggal* : ${tanggalFormat}
*Sesi Kedatangan* : ${inputJam}
*Keluhan* : ${inputKeluhan}

Terima kasih, saya tunggu konfirmasinya nggih.`;
                    
                    setTimeout(() => {
                        window.open(`https://wa.me/${NOMOR_WA_ADMIN}?text=${encodeURIComponent(textPesan)}`, '_blank');
                        document.getElementById('bookingForm').reset();
                        pesan.className = "";
                    }, 1500);

                } else {
                    pesan.className = "pesan-error";
                    pesan.innerText = "❌ Terjadi kesalahan. Coba lagi.";
                }
            })
            .catch(error => {
                pesan.className = "pesan-error";
                pesan.innerText = "❌ Gagal terhubung ke server.";
            })
            .finally(() => {
                btnText.innerText = "Kirim Reservasi";
                spinner.style.display = "none";
                btnSubmit.disabled = false;
            });
        });
    </script>
</body>
</html>
